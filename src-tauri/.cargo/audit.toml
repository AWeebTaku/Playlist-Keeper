# Advisories that are known and do not apply to this app. Everything else fails the audit (CI and `cargo audit`).
[advisories]
ignore = [
  # rsa (Marvin attack): only reachable through sqlx-mysql, which is in Cargo.lock because the SQL plugin lists it but is never
  # compiled (this app uses SQLite only: `cargo tree -i rsa` prints nothing). No fixed version exists.
  "RUSTSEC-2023-0071",
  # sqlx 0.8.0, binary protocol casts: affects the PostgreSQL and MySQL protocols, not SQLite. Upgrading to 0.8.1+ is blocked by
  # `links = "sqlite3"`: sqlx needs libsqlite3-sys 0.30, the cookie reader (rookie 0.5.6 -> rusqlite 0.31) needs 0.28. Revisit
  # when rookie moves to a newer rusqlite.
  "RUSTSEC-2024-0363",
]
