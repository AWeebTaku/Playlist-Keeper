name: release

# Builds installers for Linux, Windows and macOS and publishes a GitHub release with the auto-update feed.
#   * push to master that changes the app  -> next patch version, Linux + Windows   (skip with "[skip release]" in the commit message)
#   * "Run workflow" (Actions tab)         -> patch / minor / major; macOS is included for minor and major, or when ticked; "dry_run" only builds Linux
#   * push of a tag vX.Y.Z                 -> exactly that version, all three systems
# Nothing is published unless every build succeeded. The version is computed from the existing tags and written into the
# build checkout only (never committed), so there is no bot commit. Secret needed: TAURI_SIGNING_PRIVATE_KEY (update signing,
# see README); TAURI_SIGNING_PRIVATE_KEY_PASSWORD only if that key has a password (the generated one has none). Not OS-code-signed.

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig.json'
      - '!**/*.test.ts'
      - '!src/dev/**'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      macos:
        description: Include macOS (always on for minor and major)
        type: boolean
        default: false
      dry_run:
        description: Dry run (build Linux only, publish nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name != 'push' || github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      macos: ${{ steps.plan.outputs.macos }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Decide the version and which systems to build
        id: plan
        run: node scripts/release-plan.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_MACOS: ${{ inputs.macos }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}

  check:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check # svelte-check, eslint, colour contrast
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Check that the update signing key works (fails in seconds, not after a 15-minute build)
        run: |
          echo probe > probe.txt
          npx tauri signer sign probe.txt > /dev/null
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build:
    needs: [plan, check]
    strategy:
      fail-fast: true # one broken system stops the others, which also saves Actions minutes
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - name: Write the release version into this checkout (not committed) and point the updater at this repository
        run: |
          node scripts/set-version.mjs "$VERSION"
          node scripts/ci-config.mjs --repo "$GITHUB_REPOSITORY"
      - run: npm ci
      - name: Rust lint and tests
        if: matrix.name == 'linux'
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Build the installers
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Collect installers and signatures (spaces in names become dashes)
        run: |
          mkdir out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' \
               -o -name '*.deb.sig' -o -name '*.rpm.sig' -o -name '*.AppImage.sig' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' -o -name '*.app.tar.gz.sig' \) \
            -print0 | while IFS= read -r -d '' f; do cp "$f" "out/$(basename "$f" | tr ' ' '-')"; done
          ls -la out
          case "${{ matrix.name }}" in
            linux)   want='.deb .rpm .AppImage' ;;
            windows) want='.msi -setup.exe' ;;
            macos)   want='.dmg .app.tar.gz' ;;
          esac
          for ext in $want; do ls out/*"$ext" >/dev/null 2>&1 || { echo "missing installer *$ext"; exit 1; }; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  arch:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: installers-linux
          path: linux
      - name: Build the pacman package from the .deb
        run: |
          useradd -m builder
          mkdir /build
          cp packaging/arch/PKGBUILD LICENSE /build/
          cp linux/*.deb /build/playlist-keeper.deb
          chown -R builder /build
          cd /build
          runuser -u builder -- env PKGVER="$VERSION" REPO="$GITHUB_REPOSITORY" makepkg -df --noconfirm
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ./*.pkg.tar.zst "$GITHUB_WORKSPACE/out/"
          ls -la "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-arch
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build, arch]
    if: ${{ needs.plan.outputs.dry_run != 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
      MACOS: ${{ needs.plan.outputs.macos }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installers-*
          path: assets
          merge-multiple: true
      - name: Release notes
        run: |
          args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          [ -n "$PREVIOUS_TAG" ] && args+=(-f previous_tag_name="$PREVIOUS_TAG")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > notes.md
          {
            echo
            echo '### Which file do I need?'
            echo '| System | File |'
            echo '|---|---|'
            echo '| Windows | `*-setup.exe` (current user) or `*.msi` |'
            echo '| macOS | `*.dmg` |'
            echo '| Debian, Ubuntu, Mint | `*.deb` |'
            echo '| Fedora, openSUSE | `*.rpm` |'
            echo '| Arch, Manjaro | `*.pkg.tar.zst` (`sudo pacman -U`) |'
            echo '| Any Linux | `*.AppImage` |'
            echo
            echo 'The apps update themselves from this release feed (the Arch package is updated by installing the new file). Checksums: `SHA256SUMS.txt`.'
            if [ "$MACOS" != "true" ]; then echo; echo '_This release has no macOS build; macOS builds ship with minor and major versions._'; fi
          } >> notes.md
          cat notes.md
      - name: Update feed and checksums
        run: |
          node scripts/make-latest-json.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --notes-file notes.md --out latest.json
          cd assets
          sha256sum $(ls | grep -vE '\.sig$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release with all files at once
        run: |
          shopt -s extglob
          files=(assets/!(*.sig) latest.json)
          target=(--target "$GITHUB_SHA")
          [ "$GITHUB_REF_TYPE" = tag ] && target=()
          gh release create "$TAG" "${files[@]}" "${target[@]}" --title "Playlist Keeper $TAG" --notes-file notes.md --latest
          have=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$have" -ne "${#files[@]}" ]; then
            echo "release has $have assets, expected ${#files[@]}; removing it"
            gh release delete "$TAG" --yes --cleanup-tag
            exit 1
          fi
