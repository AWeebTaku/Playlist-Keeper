name: release

# Publishes a GitHub release with installers and the auto-update feed when a version tag is pushed:
#   npm run version:set -- 0.2.0 && git commit -am "v0.2.0" && git tag v0.2.0 && git push --follow-tags
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater key file (see README, "Releasing")
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for the key generated by the setup in the README)
# The builds are not OS-code-signed (by choice): Windows and macOS show a warning on first launch.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal the app version
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $v (run npm run version:set)"; exit 1; }

  publish:
    needs: version-matches-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # deb, rpm, AppImage
            args: ''
          - os: windows-latest # msi, nsis (.exe)
            args: ''
          - os: macos-latest # universal .app/.dmg (Apple silicon + Intel)
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: npm test
      - name: Point the updater at this repository
        run: node scripts/ci-config.mjs --repo ${{ github.repository }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Playlist Keeper ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your system below. The app updates itself after this.
            These builds are not code-signed: Windows SmartScreen ("More info" > "Run anyway") and macOS Gatekeeper
            (right-click the app > Open) ask for confirmation the first time.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
