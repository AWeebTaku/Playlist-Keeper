name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check # svelte-check + eslint
      - run: npm test
      - run: npm audit --audit-level=high

  bundle:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # deb, rpm, AppImage
            args: ''
          - os: windows-latest # msi, nsis (.exe)
            args: ''
          - os: macos-latest # universal .app and .dmg (Apple silicon + Intel)
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - name: Builds in CI have no update-signing key
        run: node scripts/ci-config.mjs --no-updater-artifacts
      - name: Rust lint and tests
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
      - name: Rust dependency audit
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: src-tauri
      # No tagName/release inputs: this builds the installers but publishes nothing.
      # Signing, notarization and publishing are deliberately not set up yet.
      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
