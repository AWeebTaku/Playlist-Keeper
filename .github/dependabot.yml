# Weekly pull requests that update the pinned GitHub Actions, npm packages and Rust crates.
# Minor and patch updates of each ecosystem arrive together in one pull request; majors come one at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # svelte-check and typescript-eslint only support TypeScript 5 and 6; update TypeScript by hand once they allow 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Node typings should match the Node major that CI runs (24), not the newest one.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      website:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ['*']
        update-types: [minor, patch]
